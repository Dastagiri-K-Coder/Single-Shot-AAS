<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Single Shot AAS — Change Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --card: #111827; --border: rgba(255,255,255,0.07);
      --accent: #4f8ef7; --accent2: #7c3aed; --text: #f1f5f9; --muted: #94a3b8;
    }
    html, body {
      min-height: 100vh; background: var(--bg);
      font-family: 'Outfit', sans-serif; color: var(--text);
      display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 70% 50% at 15% 15%, rgba(79,142,247,.10) 0%, transparent 60%),
                  radial-gradient(ellipse 50% 70% at 85% 85%, rgba(124,58,237,.09) 0%, transparent 60%);
      pointer-events: none;
    }
    .wrapper { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 2rem 1rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;
    }
    h1 { font-size: 1.2rem; font-weight: 700; }
    label { font-size: .78rem; color: var(--muted); font-weight: 500; display: block; margin-bottom: .4rem; }
    input {
      width: 100%; padding: .75rem 1rem;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-family: inherit; font-size: .9rem; outline: none;
      transition: border .2s;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; padding: .85rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 10px; color: #fff; font-family: inherit;
      font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    .flash {
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px; padding: .75rem 1rem; font-size: .82rem; color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div>
        <div style="font-size:1.8rem; margin-bottom:.5rem;">🔑</div>
        <h1>Change Password</h1>
        <p style="font-size:.82rem; color:var(--muted); margin-top:.3rem;">
          You must set a new password before continuing.
        </p>
      </div>

      {% if error %}
      <div class="flash" role="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/change-password" id="cpForm">
        <div style="display:flex; flex-direction:column; gap:1rem;">
          <div>
            <label for="new_password">New Password (min 8 characters)</label>
            <input type="password" id="new_password" name="new_password" required minlength="8"
                   placeholder="Enter new password" autocomplete="new-password" />
          </div>
          <div>
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                   placeholder="Re-enter password" autocomplete="new-password" />
          </div>
          <button type="submit" id="cpBtn">🔐 Set New Password</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('cpForm').addEventListener('submit', function() {
      const btn = document.getElementById('cpBtn');
      btn.textContent = 'Saving…'; btn.disabled = true;
    });
  </script>
</body>
</html>
