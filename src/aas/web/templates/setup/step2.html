<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup — Step 2: Create Sections | Single Shot AAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --card: #111827; --card2: #1a2235; --border: rgba(255,255,255,0.07);
      --accent: #4f8ef7; --accent2: #7c3aed; --text: #f1f5f9; --muted: #94a3b8;
      --input-bg: rgba(255,255,255,0.04); --green: #10b981; --red: #ef4444;
    }
    html, body { min-height:100vh; background:var(--bg); font-family:'Outfit',sans-serif; color:var(--text); }
    body { display:flex; flex-direction:column; align-items:center; padding:2rem 1rem; gap:2rem; }
    body::before {
      content:''; position:fixed; inset:0;
      background: radial-gradient(ellipse 70% 50% at 20% 20%, rgba(79,142,247,.08) 0%, transparent 60%);
      pointer-events:none;
    }

    /* ── Progress ── */
    .progress-wrap { width:100%; max-width:620px; position:relative; z-index:1; }
    .progress-steps { display:flex; align-items:center; }
    .step-dot {
      width:32px; height:32px; border-radius:50%; border:2px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      font-size:.75rem; font-weight:600; color:var(--muted); flex-shrink:0;
      background:var(--card);
    }
    .step-dot.active { border-color:var(--accent); color:var(--accent); background:rgba(79,142,247,.12); }
    .step-dot.done { border-color:var(--green); color:#fff; background:var(--green); }
    .step-line { flex:1; height:2px; background:var(--border); }
    .step-line.done { background:var(--green); }
    .step-labels { display:flex; justify-content:space-between; margin-top:.5rem; padding:0 4px; }
    .step-label { font-size:.67rem; color:var(--muted); text-align:center; width:80px; }
    .step-label.active { color:var(--accent); }
    .step-label.done { color:var(--green); }

    /* ── Main card ── */
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:20px;
      padding:2.5rem 2.8rem; width:100%; max-width:620px;
      display:flex; flex-direction:column; gap:1.5rem;
      box-shadow:0 0 60px rgba(0,0,0,.5); position:relative; z-index:1;
      animation: slideUp .4s ease forwards;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .card-header h2 { font-size:1.5rem; font-weight:700; }
    .card-header p  { font-size:.85rem; color:var(--muted); margin-top:.3rem; }

    /* ── Section entry form ── */
    .section-form {
      background:var(--card2); border:1px solid var(--border); border-radius:14px;
      padding:1.5rem; display:flex; flex-direction:column; gap:1rem;
    }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .form-row-3 { display:grid; grid-template-columns:2fr 1fr 1fr; gap:1rem; }
    .form-group { display:flex; flex-direction:column; gap:.4rem; }
    label { font-size:.78rem; font-weight:500; color:var(--muted); }
    input, select {
      background:var(--input-bg); border:1px solid var(--border); border-radius:10px;
      padding:.7rem 1rem; color:var(--text); font-family:'Outfit',sans-serif;
      font-size:.9rem; outline:none; width:100%;
      transition:border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,142,247,.15); }
    select option { background:#1a2235; }

    /* ── Sheet name preview ── */
    .preview-box {
      background:rgba(79,142,247,.07); border:1px solid rgba(79,142,247,.2);
      border-radius:10px; padding:.65rem 1rem; font-size:.8rem;
      color:var(--accent); font-family:monospace; word-break:break-all;
    }

    /* ── Sections list ── */
    .sections-list { display:flex; flex-direction:column; gap:.6rem; }
    .section-tag {
      display:flex; align-items:center; justify-content:space-between; gap:1rem;
      background:rgba(16,185,129,.07); border:1px solid rgba(16,185,129,.2);
      border-radius:10px; padding:.6rem 1rem;
    }
    .section-tag-name { font-size:.82rem; color:var(--green); font-family:monospace; }
    .section-tag-del {
      background:none; border:none; color:var(--red); cursor:pointer;
      font-size:.85rem; padding:.2rem .4rem; border-radius:6px;
      transition:background .15s;
    }
    .section-tag-del:hover { background:rgba(239,68,68,.12); }

    /* ── Buttons ── */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
      padding:.75rem 1.5rem; border-radius:12px; font-size:.9rem;
      font-family:'Outfit',sans-serif; font-weight:600; cursor:pointer; border:none;
      transition:transform .15s, box-shadow .15s;
    }
    .btn-outline {
      background:transparent; border:1px solid var(--accent); color:var(--accent);
    }
    .btn-outline:hover { background:rgba(79,142,247,.1); }
    .btn-primary {
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      color:#fff; box-shadow:0 4px 20px rgba(79,142,247,.3);
    }
    .btn-primary:hover { transform:translateY(-2px); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .btn-actions { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-top:.5rem; }
    .empty-state { font-size:.82rem; color:var(--muted); text-align:center; padding:.5rem 0; }
  </style>
</head>
<body>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-steps">
      <div class="step-dot done">✓</div>
      <div class="step-line done"></div>
      <div class="step-dot active">2</div>
      <div class="step-line"></div>
      <div class="step-dot">3</div>
      <div class="step-line"></div>
      <div class="step-dot">✓</div>
    </div>
    <div class="step-labels">
      <span class="step-label done">Institution</span>
      <span class="step-label active">Section</span>
      <span class="step-label">Cameras</span>
      <span class="step-label">Done</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>📊 Create Sections / Classes</h2>
      <p>Each section gets its own Google Spreadsheet following the naming convention.</p>
    </div>

    <!-- Section entry form -->
    <div class="section-form">
      <div class="form-row-3">
        <div class="form-group">
          <label>Department / Branch Code</label>
          <input id="sectionCode" type="text" placeholder="e.g. CSE, MECH, ECE" maxlength="10" />
        </div>
        <div class="form-group">
          <label>Year From</label>
          <input id="yearStart" type="number" placeholder="2024" min="2000" max="2099" />
        </div>
        <div class="form-group">
          <label>Year To</label>
          <input id="yearEnd" type="number" placeholder="2027" min="2001" max="2100" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Section</label>
          <input id="sectionId" type="text" placeholder="e.g. A, B, 1, 2" maxlength="5" />
        </div>
        <div class="form-group" style="justify-content:flex-end;">
          <label>&nbsp;</label>
          <button class="btn btn-outline" onclick="addSection()">+ Add Section</button>
        </div>
      </div>

      <!-- Live preview -->
      <div>
        <label>Spreadsheet name preview:</label>
        <div class="preview-box" id="previewBox">Single Shot AAS -? ??? Y(????-????) S(?)</div>
      </div>
    </div>

    <!-- Sections added so far -->
    <div>
      <div style="font-size:.82rem; font-weight:500; color:var(--muted); margin-bottom:.6rem;">
        Sections added (<span id="sectionCount">0</span>):
      </div>
      <div class="sections-list" id="sectionsList">
        <div class="empty-state" id="emptyState">No sections yet. Add at least one above.</div>
      </div>
    </div>

    <!-- Hidden input that stores JSON -->
    <input type="hidden" id="sectionsData" name="sections_data" value="[]" />

    <div class="btn-actions">
      <a href="/setup" style="font-size:.82rem; color:var(--muted); text-decoration:none;">← Back</a>
      <button class="btn btn-primary" id="nextBtn" onclick="submitSections()" disabled>
        Next → Assign Cameras
      </button>
    </div>
  </div>

  <script>
    var sections = [];
    var serial = {{ next_serial | default(1) }};

    function updatePreview() {
      var code  = document.getElementById('sectionCode').value.toUpperCase().trim() || '???';
      var ys    = document.getElementById('yearStart').value.trim() || '????';
      var ye    = document.getElementById('yearEnd').value.trim() || '????';
      var sec   = document.getElementById('sectionId').value.toUpperCase().trim() || '?';
      var n     = serial + sections.length;
      document.getElementById('previewBox').textContent =
        'Single Shot AAS -' + n + ' ' + code + ' Y(' + ys + '-' + ye + ') S(' + sec + ')';
    }

    ['sectionCode','yearStart','yearEnd','sectionId'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    function addSection() {
      var code = document.getElementById('sectionCode').value.toUpperCase().trim();
      var ys   = document.getElementById('yearStart').value.trim();
      var ye   = document.getElementById('yearEnd').value.trim();
      var sec  = document.getElementById('sectionId').value.toUpperCase().trim();
      if (!code || !ys || !ye || !sec) { alert('Please fill all section fields.'); return; }
      var n = serial + sections.length;
      var name = 'Single Shot AAS -' + n + ' ' + code + ' Y(' + ys + '-' + ye + ') S(' + sec + ')';
      sections.push({ serial: n, section_code: code, year_start: parseInt(ys), year_end: parseInt(ye), section: sec, sheet_name: name });
      renderSections();
      document.getElementById('sectionCode').value = '';
      document.getElementById('sectionId').value = '';
      updatePreview();
    }

    function removeSection(idx) {
      sections.splice(idx, 1);
      renderSections();
    }

    function renderSections() {
      var list  = document.getElementById('sectionsList');
      var empty = document.getElementById('emptyState');
      var count = document.getElementById('sectionCount');
      count.textContent = sections.length;
      document.getElementById('sectionsData').value = JSON.stringify(sections);
      document.getElementById('nextBtn').disabled = sections.length === 0;
      if (sections.length === 0) {
        list.innerHTML = '';
        list.appendChild(empty);
        return;
      }
      list.innerHTML = sections.map(function(s, i) {
        return '<div class="section-tag">' +
          '<span class="section-tag-name">' + s.sheet_name + '</span>' +
          '<button class="section-tag-del" onclick="removeSection(' + i + ')">✕</button>' +
          '</div>';
      }).join('');
    }

    function submitSections() {
      if (sections.length === 0) return;
      fetch('/api/setup/create-sections', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sections: sections })
      })
      .then(r => r.json())
      .then(data => {
        if (data.status === 'success') window.location.href = '/setup/step3';
        else alert('Error: ' + data.message);
      })
      .catch(e => alert('Request failed: ' + e));
    }

    updatePreview();
  </script>
</body>
</html>
