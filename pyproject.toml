[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
]
ignore = [
    "S101",  # allow assert statements
    "S603",  # subprocess without shell=True is fine
    "S301",  # pickle — flagged by bandit; tracked separately in gap analysis
    "B008",  # function calls in argument defaults (Flask routes)
]
exclude = [
    ".venv",
    "__pycache__",
    "android/",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "F401"]   # relax security + unused-import rules in tests

[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
    \.venv
  | __pycache__
  | android
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = [".venv/*", "__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts   = "-v --tb=short --cov=src/aas --cov-report=term-missing --cov-fail-under=60"
python_files   = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
omit = [
    ".venv/*",
    "tests/*",
    "*/web/static/*",
]
