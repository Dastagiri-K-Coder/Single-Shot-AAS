<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Single Shot AAS — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0e1a;
      --card:      #111827;
      --accent:    #4f8ef7;
      --accent2:   #7c3aed;
      --green:     #10b981;
      --text:      #f1f5f9;
      --muted:     #94a3b8;
      --glow:      rgba(79,142,247,0.35);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ── animated background gradient ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(79,142,247,.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(124,58,237,.10) 0%, transparent 60%);
      animation: bgPulse 6s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes bgPulse {
      from { opacity: 0.7; }
      to   { opacity: 1.0; }
    }

    /* ── container ── */
    .splash {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 2rem;
      animation: fadeIn 0.8s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── logo ring ── */
    .logo-ring {
      position: relative;
      width: 120px;
      height: 120px;
    }
    .logo-ring svg {
      width: 100%;
      height: 100%;
      animation: spinRing 3s linear infinite;
    }
    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .logo-inner {
      position: absolute;
      inset: 16px;
      background: var(--card);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 0 30px var(--glow);
    }

    /* ── text ── */
    .brand {
      text-align: center;
    }
    .brand-name {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .brand-sub {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ── loading bar ── */
    .loading-wrap {
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .loading-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .loading-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      animation: loadFill 2.4s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes loadFill {
      0%   { width: 0%;   }
      60%  { width: 75%;  }
      90%  { width: 92%;  }
      100% { width: 100%; }
    }
    .loading-text {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    /* ── dots ── */
    .dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 3px;
      animation: dot 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot {
      0%, 80%, 100% { transform: scale(.6); opacity:.3; }
      40%            { transform: scale(1);  opacity:1; }
    }

    /* ── version badge ── */
    .version {
      position: fixed;
      bottom: 24px;
      font-size: 0.72rem;
      color: rgba(148,163,184,.4);
      letter-spacing: .05em;
    }
  </style>
</head>
<body>
  <div class="splash">
    <!-- Spinning logo ring -->
    <div class="logo-ring">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="60" r="54" stroke="url(#grad)" stroke-width="4"
                stroke-dasharray="180 160" stroke-linecap="round"/>
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4f8ef7"/>
            <stop offset="100%" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="logo-inner">📸</div>
    </div>

    <!-- Brand name -->
    <div class="brand">
      <div class="brand-name">Single Shot AAS</div>
      <div class="brand-sub">AI Attendance System</div>
    </div>

    <!-- Loading progress -->
    <div class="loading-wrap">
      <div class="loading-bar">
        <div class="loading-fill" id="loadFill"></div>
      </div>
      <div class="loading-text">
        Initializing system <span class="dots"><span></span><span></span><span></span></span>
      </div>
    </div>
  </div>

  <div class="version">v2.0 · Single Shot AAS</div>

  <script>
    // After loading bar completes, redirect to login or dashboard
    setTimeout(function () {
      fetch('/api/auth/status')
        .then(r => r.json())
        .then(data => {
          if (data.authenticated) {
            window.location.href = data.setup_complete ? '/dashboard' : '/setup';
          } else {
            window.location.href = '/login';
          }
        })
        .catch(() => {
          // If backend not ready yet, go to login
          window.location.href = '/login';
        });
    }, 2800);
  </script>
</body>
</html>
